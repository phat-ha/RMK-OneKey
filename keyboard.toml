[keyboard]
name = "OneKey"
product_name = "OneKey"
vendor_id = 0x5959
product_id = 0x3037
manufacturer = "YinYang"
chip = "rp2040"

[host]
vial_enabled = false

[matrix]
matrix_type = "direct_pin"
direct_pins = [
    ["PIN_18", "PIN_6", "PIN_23"]
]

direct_pin_low_active = true

[layout]
rows = 1
cols = 3
layers = 1
matrix_map = """
             (0,0) (0,1) (0,2)
             """

[[layer]]
name = "morse_code"
keys = """
       Backspace TD(0) Enter
       """

[behavior.combo]
timeout = "150ms"
combos = [
  { actions = ["Backspace", "Enter"], output = "Space" },
]

[behavior.morse]
morses = [
{ morse_actions = [
      {pattern = ".-", action = "A"},
      {pattern = "-...", action = "B"},
      {pattern = "-.-.", action = "C"},
      {pattern = "-..", action = "D"},
      {pattern = ".", action = "E"},
      {pattern = "..-.", action = "F"},
      {pattern = "--.", action = "G"},
      {pattern = "....", action = "H"},
      {pattern = "..", action = "I"},
      {pattern = ".---", action = "J"},
      {pattern = "-.-", action = "K"},
      {pattern = ".-..", action = "L"},
      {pattern = "--", action = "M"},
      {pattern = "-.", action = "N"},
      {pattern = "---", action = "O"},
      {pattern = ".--.", action = "P"},
      {pattern = "--.-", action = "Q"},
      {pattern = ".-.", action = "R"},
      {pattern = "...", action = "S"},
      {pattern = "-", action = "T"},
      {pattern = "..-", action = "U"},
      {pattern = "...-", action = "V"},
      {pattern = ".--", action = "W"},
      {pattern = "-..-", action = "X"},
      {pattern = "-.--", action = "Y"},
      {pattern = "--..", action = "Z"},
      {pattern = ".----", action = "Kc1"},
      {pattern = "..---", action = "Kc2"},
      {pattern = "...--", action = "Kc3"},
      {pattern = "....-", action = "Kc4"},
      {pattern = ".....", action = "Kc5"},
      {pattern = "-....", action = "Kc6"},
      {pattern = "--...", action = "Kc7"},
      {pattern = "---..", action = "Kc8"},
      {pattern = "----.", action = "Kc9"},
      {pattern = "-----", action = "Kc0"},
      {pattern = ".-.-.-", action = "Dot"},
      {pattern = "--..--", action = "Comma"},
      {pattern = "..--..", action = "SHIFTED(Slash)"},
      {pattern = ".----.", action = "Quote"},
      {pattern = "-.-.--", action = "SHIFTED(Kc1)"},
      {pattern = "-..-.", action = "Slash"},
      {pattern = "-.--.", action = "SHIFTED(Kc9)"},
      {pattern = "-.--.-", action = "SHIFTED(Kc0)"},
      {pattern = "---...", action = "SHIFTED(Semicolon)"},
      {pattern = "-.-.-.", action = "Semicolon"},
      {pattern = ".......", action = "Space"}
    ], profile = "MRZ" }
]

[behavior.morse.profiles]
MRZ = { normal_mode = true, unilateral_tap = false, hold_timeout = "200ms", gap_timeout = "200ms" }

[rmk]
max_patterns_per_key = 47

[storage]
enabled = false
